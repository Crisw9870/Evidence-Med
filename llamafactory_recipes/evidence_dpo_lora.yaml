### model
# D0 is Qwen2.5-7B-Instruct with the Evidence-SFT LoRA merged into it.
model_name_or_path: ./outputs/dpo-start-direct-merged
trust_remote_code: true

### method
stage: dpo
do_train: true
do_eval: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
pref_beta: 0.1
pref_loss: sigmoid

### dataset
dataset_dir: ./llamafactory_recipes/data
dataset: evidence_dpo_train
eval_dataset: evidence_dpo_validation
template: qwen
cutoff_len: 1536
overwrite_cache: false
preprocessing_num_workers: 6
dataloader_num_workers: 2

### output
output_dir: ./outputs/llamafactory-evidence-dpo
logging_steps: 5
save_steps: 25
save_total_limit: 2
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: tensorboard

### train
per_device_train_batch_size: 2
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.05
bf16: true
fp16: false
gradient_checkpointing: true
seed: 42
data_seed: 42
ddp_timeout: 180000000

### eval
eval_strategy: steps
eval_steps: 25
